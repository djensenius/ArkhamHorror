# Fields are TAB-separated:
#   record  component  platform  artifact  authority-kind  sha256  version-or-recipe
#
# `archive` SHA-256 values are authoritative upstream artifact bytes. `binary`
# records with authority-kind `exact` are authoritative installed executable
# bytes. Native source builds cannot promise identical executable bytes across
# Xcode/GCC/linker patch levels, so `derived` rows hash the complete immutable
# build identity (component, platform, version, source SHA-256, and recipe).
# The installer records the resulting executable SHA-256 in an atomic
# installation manifest and validates that byte identity before every cache-hit
# execution. Changing either the build recipe or source archive requires an
# intentional lock update.
#
# This file is deliberately duplicated by platform, including source archives
# whose bytes happen to be identical. A platform with no exact row is not
# supported and the installer fails closed.

