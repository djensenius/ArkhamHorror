# Restored installation manifests are observations only. Each new invocation
# reconstructs any unreceipted install from the verified archive/source, then
# records and checks a full execution-tree SHA-256 against an invocation-
# external receipt. Changing either the build recipe or source archive requires
# an intentional lock update.
#
