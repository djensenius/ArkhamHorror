[tools]
node = "26.7.0"
python = "3.14.7"
uv = "0.12.6"

[tasks."contracts:fixtures"]
description = "Validate contract manifests, golden JSON fixtures, negative regressions, and artifact hash bindings"
run = "uv run scripts/validate-contract-fixtures.py"

[tasks."contracts:revision-drift"]
description = "Enforce the schemaRevision monotonic-bump gate for governed contract artifacts"
run = "uv run scripts/check-schema-revision-drift.py"

[tasks."contracts:openapi"]
description = "Lint the REST OpenAPI document"
run = "npx --yes @redocly/cli@2.49.0 lint contracts/openapi.yaml"

[tasks."contracts:asyncapi"]
description = "Validate the WebSocket AsyncAPI document"
run = "npx --yes @asyncapi/cli@6.0.2 validate contracts/asyncapi.yaml"

[tasks."contracts:routes"]
description = "Validate the exact backend route inventory"
run = "uv run scripts/validate-route-inventory.py"

[tasks."contracts:validate"]
description = "Run every native-client contract check"
depends = [
  "contracts:fixtures",
  "contracts:revision-drift",
  "contracts:openapi",
  "contracts:asyncapi",
  "contracts:routes",
]
