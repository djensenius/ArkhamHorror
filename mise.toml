[tools]
node = "26.7.0"
python = "3.14.7"
uv = "0.12.6"

[tasks."replay:harness"]
description = "Run the backend-owned deterministic replay/checkpoint CLI"
raw = true
run = "/bin/sh scripts/test-replay-harness.sh --run"

[tasks."replay:harness:test"]
description = "Run focused replay unit and actual-executable fixture tests"
run = "/bin/sh scripts/test-replay-harness.sh"

[tasks."contracts:fixtures"]
description = "Validate contract manifests, golden JSON fixtures, and negative regressions"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/validate-contract-fixtures.py"

[tasks."contracts:revision-drift"]
description = "AUTHORITATIVE: enforce the schemaRevision monotonic-bump gate against an explicit ancestor base SHA passed positionally"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/check-schema-revision-drift.py"

[tasks."contracts:revision-drift-local"]
description = "NON-AUTHORITATIVE local convenience: run the revision-drift gate with its explicit local-only fallback chain; CI never runs this task"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/check-schema-revision-drift.py --allow-local-fallback"

[tasks."contracts:openapi"]
description = "Lint the REST OpenAPI document"
run = "npx --yes @redocly/cli@2.49.0 lint contracts/openapi.yaml"

[tasks."contracts:asyncapi"]
description = "Validate the WebSocket AsyncAPI document"
run = "npx --yes @asyncapi/cli@6.0.2 validate contracts/asyncapi.yaml"

[tasks."contracts:routes"]
description = "Validate the exact backend route inventory"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/validate-route-inventory.py"

[tasks."contracts:catalog-fixture"]
description = "Re-derive the synthetic locale-catalog fixture set from its committed authorities and verify every digest, count, path and provenance value"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/build-locale-catalog-fixture.py --check"

[tasks."contracts:catalog-fixture-write"]
description = "Rewrite the synthetic locale-catalog fixture set (run after a contract revision bump)"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/build-locale-catalog-fixture.py"

[tasks."contracts:manifest-hashes"]
description = "Refresh governed contract-artifact hashes after an intentional fixture or schema update"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/update-manifest-hashes.py"

[tasks."locale-catalog:python-boundary-test"]
description = "Run production-command adversarial checks for the isolated Python boundary"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/test_locale_catalog_python_boundary.py"

[tasks."contracts:validate"]
description = "Run every native-client contract check"
depends = [
  "contracts:catalog-fixture",
  "contracts:fixtures",
  "contracts:revision-drift-local",
  "contracts:openapi",
  "contracts:asyncapi",
  "contracts:routes",
]

[tasks."locale-catalog:backend-keys"]
description = "Re-derive the backend's emitted i18n key registry from the Haskell sources"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/extract-backend-i18n-keys.py"

[tasks."locale-catalog:backend-keys-check"]
description = "Fail if the committed backend emitted-key registry has drifted from the Haskell sources"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/extract-backend-i18n-keys.py --check"

[tasks."locale-catalog:backend-keys-test"]
description = "Run the backend emitted-key extractor's own tests (synthetic modules plus registry properties)"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/test_extract_backend_i18n_keys.py"

[tasks."locale-catalog:offline-cache-test"]
description = "Check the offline build's cache key really covers every locale-catalog provenance input"
run = "bash offline/scripts/test-frontend-cache-hash.sh"

[tasks."locale-catalog:offline-cache-hit-test"]
description = "Exercise adversarial catalog-subtree verification without frontend/public; rendered frontend output itself is never restored"
run = "bash offline/scripts/test-frontend-cache-hit.sh"

[tasks."locale-catalog:offline-toolchain-authority-test"]
description = "Reject corrupted offline download caches, wrong archives, missing platform authorities, substituted binaries, and stale cache keys"
run = "bash offline/scripts/test-toolchain-authority.sh"

[tasks."locale-catalog:offline-output-authority-test"]
description = "Reject frontend asset and package library substitutions against invocation-external authority receipts"
run = "bash offline/scripts/test-frontend-npm-authority.sh && bash offline/scripts/test-frontend-output-authority.sh && bash offline/scripts/test-package-authority.sh && bash offline/scripts/test-package-attestation.sh && bash offline/scripts/test-package-lifecycle.sh && bash offline/scripts/test-receipt-capability-isolation.sh && bash offline/scripts/test-updater-authority.sh && bash offline/scripts/test-docker-toolchain-authority.sh"

[tasks."locale-catalog:serving-cleanup-test"]
description = "Force post-start nginx failures and prove serving contexts clean their container/process"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/validate-catalog-serving.py --self-test"

[tasks."locale-catalog:serving"]
description = "Verify live catalog serving against an explicitly built final production image; no surrogate config/image is accepted"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/validate-catalog-serving.py --production-image \"${ARKHAM_PRODUCTION_IMAGE:?locale-catalog serving requires an explicit final Docker image}\""

[tasks."locale-catalog:test"]
description = "Run the locale-catalog render-AST and generator tests"
run = "npm --prefix frontend run test:locale-catalog"

[tasks."locale-catalog:generate"]
description = "Generate the public locale catalog into frontend/public/locale-catalog"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/generate-locale-catalog.py"

[tasks."locale-catalog:capability-settings"]
description = "Check a real generated catalog manifest can populate the ARKHAM_LOCALE_CATALOG_* settings and that the response it produces satisfies the governed capabilities schema"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/check-locale-catalog-settings.py"

[tasks."locale-catalog:capability-probe"]
description = "Run the real backend capabilities probe over a generated catalog manifest: production settings parsing, handler and toEncoding, plus a corrupted-setting startup-failure matrix"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/check-locale-catalog-settings.py --probe \"${LOCALE_CATALOG_PROBE:?locale-catalog capability probe requires an explicit absolute LOCALE_CATALOG_PROBE authority}\""

[tasks."locale-catalog:validate"]
description = "Generate the public locale catalog and verify its schemas, digests, provenance, clean-clone reproducibility, and deploy seam"
run = "/bin/sh scripts/run-locale-catalog-python.sh scripts/validate-locale-catalog.py"
