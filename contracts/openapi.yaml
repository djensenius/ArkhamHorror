openapi: 3.1.0
info:
  title: Arkham Horror API
  version: 0.1.8
  description: |
    Initial native-client contract baseline. Only documented operations are
    covered; undocumented /api/v1 routes retain their existing behavior.
servers:
  - url: /api/v1
paths:
  /authenticate:
    post:
      operationId: authenticate
      summary: Exchange email and password for an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authentication"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Authentication failed
  /register:
    post:
      operationId: register
      summary: Create an account and return an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
  /password-reset:
    post:
      operationId: requestPasswordReset
      summary: Create a one-day password-reset token and send its browser link
      description: |
        The current server returns `404` when the email does not identify an
        account. Clients must present the same neutral result for `200` and
        `404` rather than using this distinction for account discovery. A
        successful response has no body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password-reset email processing completed
        "404":
          description: |
            Request could not be completed; clients must present the same
            neutral result as a successful request
  /password-reset/{passwordResetId}:
    put:
      operationId: resetPassword
      summary: Replace the password associated with a reset token
      description: |
        An expired token is deleted and currently returns `200` without
        changing the password. A successful response has no body.
      security: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetUpdate"
      responses:
        "200":
          description: Reset token processing completed
        "404":
          description: Reset token does not exist
  /whoami:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Token is absent or invalid
  /settings:
    put:
      operationId: updateSettings
      summary: Update settings for the authenticated account
      description: |
        The response identifies the updated account but, unlike `GET /whoami`,
        does not include the account's administrator flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Updated account and settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUser"
        "401":
          description: Token is absent or invalid
  /account:
    delete:
      operationId: deleteAccount
      summary: Permanently delete the authenticated account
      description: |
        Deletes outstanding password-reset tokens before deleting the account.
        A successful response has no body.
      responses:
        "200":
          description: Account deleted
        "401":
          description: Token is absent or invalid
  /site-settings:
    get:
      operationId: getSiteSettings
      summary: Return public deployment settings
      security: []
      responses:
        "200":
          description: Public deployment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /capabilities:
    get:
      operationId: getServerCapabilities
      summary: Negotiate the native-client contract and optional server features
      description: |
        This public endpoint binds the running server to its contract bundle.
        Clients compare numeric revision components rather than comparing the
        strings lexically. Unknown capability identifiers are additive and
        must be ignored; a missing identifier means the client must not assume
        that behavior is available.

        A `404` from this path identifies a legacy server. Clients may offer a
        conservative compatibility mode using `/site-settings`, but must not
        infer capabilities merely because another route exists.

        The optional `localeCatalog` object is additive in exactly the same
        sense: it appears only when the deployment publishes a locale catalog
        (`docs/locale-catalog.md`), and only together with the
        `i18n.locale-catalog.v1` identifier. Its absence means this deployment
        publishes no catalog — it says nothing about the server's age, and a
        client must fall back to treating story keys as unresolvable rather
        than probing a guessed catalog path. `manifestUrl` is the sole
        authority for where the catalog lives: a relative value is resolved
        against the origin this response came from, and an absolute value is
        always `https`. A client must never rewrite it onto another host, and
        must verify the manifest it downloads against `manifestSha256` before
        using it.
      security: []
      responses:
        "200":
          description: Contract compatibility and server capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCapabilities"
        "404":
          description: |
            The server predates capability negotiation; no response body shape
            is guaranteed
  /notifications:
    get:
      operationId: listNotifications
      summary: List public global announcements
      description: Returns all announcements ordered newest first.
      security: []
      responses:
        "200":
          description: Global announcements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /arkham/achievements:
    get:
      operationId: listAchievements
      summary: List achievement rows for the authenticated account
      description: |
        Returns earned and in-progress rows for the requesting user, ordered by
        `earnedAt` ascending. In-progress rows have a null `earnedAt`.
      responses:
        "200":
          description: Account achievement rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementList"
        "401":
          description: Token is absent or invalid
    delete:
      operationId: clearAchievements
      summary: Clear selected earned achievements for the authenticated account
      description: |
        Clears all earned rows, those associated with a campaign, or one named
        achievement. In-progress rows with a null `earnedAt` are never deleted.
        Achievement identifiers are additive flat constructor-name strings; an
        identifier unknown to this server is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAchievements"
      responses:
        "200":
          description: Selected earned achievement rows were cleared
        "400":
          description: Scope or achievement identifier is invalid
        "401":
          description: Token is absent or invalid
  /arkham/cards:
    get:
      operationId: listCards
      summary: List built-in and installed player or campaign cards
      description: |
        Defaults to the player-card pool. `cardPool=campaign` returns campaign
        cards, while `cardPool=both` returns both pools. For compatibility,
        merely including the legacy `includeEncounter` parameter selects both
        pools when `cardPool` is neither `campaign` nor `both`.

        Browser lists omit the `01000` placeholder, special player assets, and
        the later code of a two-sided card when both sides have definitions.
        Results are not paginated.
      security: []
      parameters:
        - name: cardPool
          in: query
          required: false
          schema:
            type: string
            enum:
              - player
              - campaign
              - both
            default: player
        - name: includeEncounter
          in: query
          required: false
          deprecated: true
          description: |
            Presence enables the legacy combined pool behavior; the parameter
            value is ignored.
          schema:
            type: string
      responses:
        "200":
          description: Browser-visible card definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
  /arkham/homebrew/cards:
    get:
      operationId: listHomebrewCards
      summary: List browser-visible cards from installed homebrew campaigns
      description: |
        Returns homebrew locations, enemies, treacheries, acts, agendas,
        encounter assets, player skills, and stories. Two-sided definitions
        are deduplicated with the same rule as the primary card catalog.
      security: []
      responses:
        "200":
          description: Browser-visible homebrew card definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
  /arkham/card/{cardCode}:
    get:
      operationId: getCard
      summary: Return one card definition by its raw card code
      description: |
        The path uses the raw code, such as `01020` or `:dark-matter:151`.
        Unlike `CardDef.cardCode` in JSON, it does not include the Aeson `c`
        prefix.
      security: []
      parameters:
        - $ref: "#/components/parameters/CardCode"
      responses:
        "200":
          description: Card definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDef"
        "404":
          description: Card code does not exist
  /arkham/investigators:
    get:
      operationId: listInvestigatorArtwork
      summary: List available investigator artwork identifiers
      description: |
        Returns raw artwork identifiers rather than full card definitions.
        Alternate printings are separate entries.
      security: []
      responses:
        "200":
          description: Investigator artwork identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigatorArtwork"
  /arkham/decks:
    get:
      operationId: listDecks
      summary: List saved decks for the authenticated account
      description: |
        Returns only the requesting user's decks. The server does not currently
        define a stable result order.
      responses:
        "200":
          description: Saved decks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckListResponse"
        "401":
          description: Token is absent or invalid
    post:
      operationId: createDeck
      summary: Save an imported deck for the authenticated account
      description: |
        The required legacy `deckId` is decoded but not persisted; the server
        assigns the returned deck's UUID. Before insertion, the server rejects
        unimplemented card codes in `deckList.slots`. It does not perform deck
        legality checks or validate `sideSlots`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckRequest"
      responses:
        "200":
          description: Saved deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: One or more main-slot card codes are not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckValidationErrors"
        "401":
          description: Token is absent or invalid
  /arkham/decks/fetch:
    post:
      operationId: fetchDeckList
      summary: Fetch and normalize an external deck list
      description: |
        The server accepts either one deck-list object or an array and uses the
        first array entry. arkham.build share links are rewritten to its public
        API and return a null `url`; other URLs remain in the normalized list.
        This operation parses but does not validate card implementation or deck
        legality. A `sideSlots` value that cannot decode as a card-quantity
        object currently normalizes to an empty object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchDeckRequest"
      responses:
        "200":
          description: Normalized external deck list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedDeckList"
        "400":
          description: The remote content is not a usable deck list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckOperationError"
        "401":
          description: Token is absent or invalid
        "500":
          description: The remote request failed before a response could be decoded
  /arkham/decks/validate:
    post:
      operationId: validateDeckList
      summary: Check whether main-slot cards are implemented
      description: |
        This is a read-only, safely retryable check. Despite its historical
        name, it checks only that every code in `slots` exists in the server's
        player-card registry. It does not check deck legality, investigator
        support, quantities, or `sideSlots`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckListInput"
      responses:
        "200":
          description: Every main-slot card code is implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckValidationSuccess"
        "400":
          description: One or more main-slot card codes are not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckValidationErrors"
        "401":
          description: Token is absent or invalid
  /arkham/decks/{deckId}:
    get:
      operationId: getDeck
      summary: Return one saved deck owned by the authenticated account
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Saved deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "401":
          description: Token is absent or invalid
        "404":
          description: Deck does not exist or belongs to another account
    delete:
      operationId: deleteDeck
      summary: Delete one saved deck owned by the authenticated account
      description: |
        A successful response has no relevant body. Deleting a missing deck or
        a deck owned by another account is also treated as success.
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Deck is absent for this account
        "401":
          description: Token is absent or invalid
  /arkham/decks/{deckId}/sync:
    post:
      operationId: syncDeck
      summary: Replace a saved deck list from its external URL
      description: |
        Fetches the saved `url` and replaces only the embedded `list`; it does
        not rerun the implemented-card validation used during creation.
      parameters:
        - $ref: "#/components/parameters/DeckId"
      responses:
        "200":
          description: Synchronized saved deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: Deck belongs to another account, has no URL, or could not be decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckOperationError"
        "401":
          description: Token is absent or invalid
        "404":
          description: Deck does not exist
        "500":
          description: The remote request failed before a response could be decoded
  /arkham/games:
    get:
      operationId: listGames
      summary: List games visible to the authenticated account
      description: |
        Returns games ordered by most recently updated. Epic Multiplayer group
        games are omitted because they are surfaced through their event.
        Corrupt legacy game rows remain visible as entries containing `error`.
      responses:
        "200":
          description: Visible games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
        "401":
          description: Token is absent or invalid
    post:
      operationId: createGame
      summary: Create and initialize a campaign or standalone game
      description: |
        At least one of `campaignId` or `scenarioId` must be non-null. When a
        campaign ID is present, the optional scenario selects its starting
        point. `ultimatumsAndBoons` defaults to an empty set and
        `achievementsEnabled` defaults to true.

        The required legacy `deckIds` array is decoded but is not currently
        consumed by game initialization. Creation has no idempotency key:
        retrying after an ambiguous transport failure can create another game.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "200":
          description: Initialized authoritative game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGame"
        "400":
          description: Request JSON cannot be decoded
        "401":
          description: Token is absent or invalid
        "500":
          description: Campaign or scenario initialization failed
  /arkham/games/{gameId}:
    get:
      operationId: getGame
      summary: Fetch the authoritative participant view of a game
      description: |
        Requires membership in the game. A WebSocket upgrade on this same path
        opens the bidirectional game stream documented by AsyncAPI.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Participant identity, multiplayer mode, event link, and game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGame"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game or participant membership does not exist
    delete:
      operationId: deleteGame
      summary: Delete a game in which the authenticated account participates
      description: |
        Any participant row authorizes deletion; there is no separate game
        owner. Missing games and IDs in which the account does not participate
        are intentionally indistinguishable no-op successes, so this operation
        is safely repeatable.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Deletion request completed without disclosing game existence
        "401":
          description: Token is absent or invalid
  /arkham/games/{gameId}/join:
    get:
      operationId: getPendingGame
      summary: Preview a game before joining it
      description: |
        Requires authentication but not existing game membership. The returned
        `PublicGame.log` is always empty.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Pending game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGame"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game does not exist
    put:
      operationId: joinPendingGame
      summary: Join a pending multiplayer game
      description: |
        The request has no body. Joining twice is idempotent. A game that is no
        longer pending is returned unchanged rather than rejected. Epic
        Multiplayer participants cannot join a second group in the same event.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Current game snapshot after the join attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGame"
        "401":
          description: Token is absent or invalid
        "403":
          description: Account already occupies another group in this Epic event
        "404":
          description: Game does not exist
  /arkham/games/{gameId}/decks:
    put:
      operationId: chooseGameDeck
      summary: Submit or skip a deck-selection or upgrade prompt
      description: |
        `deckList` takes precedence when both it and `deckUrl` are supplied.
        Omitting both continues without upgrading. Main-slot cards are checked
        for server implementation, but deck legality is not validated.

        After deck resolution succeeds, a request for a game or investigator
        that is no longer waiting for a deck succeeds without changing state.
        The caller must be a participant in the target game; administrators may
        submit for any game.
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChooseGameDeckRequest"
      responses:
        "200":
          description: Deck selection was applied, skipped, or already obsolete
        "400":
          description: Deck fetch, decoding, validation, or investigator lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckOperationError"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game does not exist, or the authenticated caller is not a participant
        "500":
          description: Engine processing failed without persisting a partial update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckOperationError"
  /arkham/games/{gameId}/open-seats:
    get:
      operationId: listOpenGameSeats
      summary: List unclaimed investigator seats
      description: |
        Returned investigator codes always include their Aeson `c` prefix.
        The current web lobby polls this operation while a game is pending.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Unclaimed investigator codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenGameSeats"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game does not exist
  /arkham/games/{gameId}/claim-seat:
    post:
      operationId: claimGameSeat
      summary: Claim one investigator in a multiplayer game
      description: |
        The request accepts investigator codes with or without the Aeson `c`
        prefix. Claims are limited to `WithFriends` games, one seat per account,
        and one account per seat. There is no player-facing unclaim operation.
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimGameSeatRequest"
      responses:
        "200":
          description: Seat was claimed
        "400":
          description: Investigator is not a seat in this game
        "401":
          description: Token is absent or invalid
        "403":
          description: Game is not multiplayer, seat is occupied, or account already has a seat
        "404":
          description: Game does not exist
  /arkham/games/{gameId}/achievements:
    get:
      operationId: listGameAchievements
      summary: List achievement rows associated with one game
      description: |
        Requires membership in the game. Returns earned and in-progress rows
        for every user associated with that game, ordered by `earnedAt`
        ascending; clients use `userId` to attribute each row.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Achievement rows associated with the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementList"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game or participant membership does not exist
  /arkham/games/{gameId}/spectate:
    get:
      operationId: spectateGame
      summary: Fetch the public spectator view of a game
      description: |
        This route does not require an account or game membership. Its
        WebSocket upgrade opens the server-enforced read-only spectator stream
        documented by AsyncAPI; inbound frames are ignored.
      security: []
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Active-player rendering ID, multiplayer mode, event link, and game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGame"
        "404":
          description: Game does not exist
  /arkham/games/{gameId}/step:
    get:
      operationId: getGameStep
      summary: Read the inexpensive monotonic game step
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Current persisted game step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStep"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game does not exist
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Send the value as `Token <token>`.
  parameters:
    PasswordResetId:
      name: passwordResetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardCode:
      name: cardCode
      in: path
      required: true
      description: Raw card code without the JSON representation's leading `c`.
      schema:
        type: string
        minLength: 1
    DeckId:
      name: deckId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Authentication:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Registration:
      type: object
      additionalProperties: false
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
    Token:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    PasswordResetRequest:
      $ref: "./schemas/account.schema.json#/$defs/passwordResetRequest"
    PasswordResetUpdate:
      $ref: "./schemas/account.schema.json#/$defs/passwordResetUpdate"
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - beta
        - admin
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        beta:
          type: boolean
        admin:
          type: boolean
    UserSettings:
      $ref: "./schemas/account.schema.json#/$defs/userSettings"
    SettingsUser:
      $ref: "./schemas/account.schema.json#/$defs/settingsUser"
    SiteSettings:
      type: object
      additionalProperties: false
      required:
        - assetHost
      properties:
        assetHost:
          type:
            - string
            - "null"
          format: uri
    ServerCapabilities:
      $ref: "./schemas/capabilities.schema.json"
    NotificationList:
      $ref: "./schemas/account.schema.json#/$defs/notificationList"
    AchievementList:
      $ref: "./schemas/achievements.schema.json#/$defs/achievementList"
    ClearAchievements:
      $ref: "./schemas/achievements.schema.json#/$defs/clearAchievements"
    CardDef:
      $ref: "./schemas/catalog.schema.json#/$defs/cardDef"
    CardList:
      $ref: "./schemas/catalog.schema.json#/$defs/cardList"
    InvestigatorArtwork:
      $ref: "./schemas/catalog.schema.json#/$defs/investigatorArtwork"
    Deck:
