openapi: 3.1.0
info:
  title: Arkham Horror API
  version: 0.1.4
  description: |
    Initial native-client contract baseline. Only documented operations are
    covered; undocumented /api/v1 routes retain their existing behavior.
servers:
  - url: /api/v1
paths:
  /authenticate:
    post:
      operationId: authenticate
      summary: Exchange email and password for an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authentication"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          description: Authentication failed
  /register:
    post:
      operationId: register
      summary: Create an account and return an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "200":
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
  /password-reset:
    post:
      operationId: requestPasswordReset
      summary: Create a one-day password-reset token and send its browser link
      description: |
        The current server returns `404` when the email does not identify an
        account. Clients must present the same neutral result for `200` and
        `404` rather than using this distinction for account discovery. A
        successful response has no body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password-reset email processing completed
        "404":
          description: |
            Request could not be completed; clients must present the same
            neutral result as a successful request
  /password-reset/{passwordResetId}:
    put:
      operationId: resetPassword
      summary: Replace the password associated with a reset token
      description: |
        An expired token is deleted and currently returns `200` without
        changing the password. A successful response has no body.
      security: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetUpdate"
      responses:
        "200":
          description: Reset token processing completed
        "404":
          description: Reset token does not exist
  /whoami:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Token is absent or invalid
  /settings:
    put:
      operationId: updateSettings
      summary: Update settings for the authenticated account
      description: |
        The response identifies the updated account but, unlike `GET /whoami`,
        does not include the account's administrator flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Updated account and settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUser"
        "401":
          description: Token is absent or invalid
  /account:
    delete:
      operationId: deleteAccount
      summary: Permanently delete the authenticated account
      description: |
        Deletes outstanding password-reset tokens before deleting the account.
        A successful response has no body.
      responses:
        "200":
          description: Account deleted
        "401":
          description: Token is absent or invalid
  /site-settings:
    get:
      operationId: getSiteSettings
      summary: Return public deployment settings
      security: []
      responses:
        "200":
          description: Public deployment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /notifications:
    get:
      operationId: listNotifications
      summary: List public global announcements
      description: Returns all announcements ordered newest first.
      security: []
      responses:
        "200":
          description: Global announcements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /arkham/cards:
    get:
      operationId: listCards
      summary: List built-in and installed player or campaign cards
      description: |
        Defaults to the player-card pool. `cardPool=campaign` returns campaign
        cards, while `cardPool=both` returns both pools. For compatibility,
        merely including the legacy `includeEncounter` parameter selects both
        pools when `cardPool` is neither `campaign` nor `both`.

        Browser lists omit the `01000` placeholder, special player assets, and
        the later code of a two-sided card when both sides have definitions.
        Results are not paginated.
      security: []
      parameters:
        - name: cardPool
          in: query
          required: false
          schema:
            type: string
            enum:
              - player
              - campaign
              - both
            default: player
        - name: includeEncounter
          in: query
          required: false
          deprecated: true
          description: |
            Presence enables the legacy combined pool behavior; the parameter
            value is ignored.
          schema:
            type: string
      responses:
        "200":
          description: Browser-visible card definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
  /arkham/homebrew/cards:
    get:
      operationId: listHomebrewCards
      summary: List browser-visible cards from installed homebrew campaigns
      description: |
        Returns homebrew locations, enemies, treacheries, acts, agendas,
        encounter assets, player skills, and stories. Two-sided definitions
        are deduplicated with the same rule as the primary card catalog.
      security: []
      responses:
        "200":
          description: Browser-visible homebrew card definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
  /arkham/card/{cardCode}:
    get:
      operationId: getCard
      summary: Return one card definition by its raw card code
      description: |
        The path uses the raw code, such as `01020` or `:dark-matter:151`.
        Unlike `CardDef.cardCode` in JSON, it does not include the Aeson `c`
        prefix.
      security: []
      parameters:
        - $ref: "#/components/parameters/CardCode"
      responses:
        "200":
          description: Card definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDef"
        "404":
          description: Card code does not exist
  /arkham/investigators:
    get:
      operationId: listInvestigatorArtwork
      summary: List available investigator artwork identifiers
      description: |
        Returns raw artwork identifiers rather than full card definitions.
        Alternate printings are separate entries.
      security: []
      responses:
        "200":
          description: Investigator artwork identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigatorArtwork"
  /arkham/games:
    get:
      operationId: listGames
      summary: List games visible to the authenticated account
      description: |
        Returns games ordered by most recently updated. Epic Multiplayer group
        games are omitted because they are surfaced through their event.
        Corrupt legacy game rows remain visible as entries containing `error`.
      responses:
        "200":
          description: Visible games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
        "401":
          description: Token is absent or invalid
  /arkham/games/{gameId}:
    get:
      operationId: getGame
      summary: Fetch the authoritative participant view of a game
      description: |
        Requires membership in the game. A WebSocket upgrade on this same path
        opens the bidirectional game stream documented by AsyncAPI.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Participant identity, multiplayer mode, event link, and game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGame"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game or participant membership does not exist
  /arkham/games/{gameId}/spectate:
    get:
      operationId: spectateGame
      summary: Fetch the public spectator view of a game
      description: |
        This route does not require an account or game membership. Its
        WebSocket upgrade opens the server-enforced read-only spectator stream
        documented by AsyncAPI; inbound frames are ignored.
      security: []
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Active-player rendering ID, multiplayer mode, event link, and game snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGame"
        "404":
          description: Game does not exist
  /arkham/games/{gameId}/step:
    get:
      operationId: getGameStep
      summary: Read the inexpensive monotonic game step
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Current persisted game step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStep"
        "401":
          description: Token is absent or invalid
        "404":
          description: Game does not exist
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Send the value as `Token <token>`.
  parameters:
    PasswordResetId:
      name: passwordResetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardCode:
      name: cardCode
      in: path
      required: true
      description: Raw card code without the JSON representation's leading `c`.
      schema:
        type: string
        minLength: 1
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Authentication:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Registration:
      type: object
      additionalProperties: false
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
    Token:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    PasswordResetRequest:
      $ref: "./schemas/account.schema.json#/$defs/passwordResetRequest"
    PasswordResetUpdate:
      $ref: "./schemas/account.schema.json#/$defs/passwordResetUpdate"
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - beta
        - admin
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        beta:
          type: boolean
        admin:
          type: boolean
    UserSettings:
      $ref: "./schemas/account.schema.json#/$defs/userSettings"
    SettingsUser:
      $ref: "./schemas/account.schema.json#/$defs/settingsUser"
    SiteSettings:
      type: object
      additionalProperties: false
      required:
        - assetHost
      properties:
        assetHost:
          type:
            - string
            - "null"
          format: uri
    NotificationList:
      $ref: "./schemas/account.schema.json#/$defs/notificationList"
    CardDef:
      $ref: "./schemas/catalog.schema.json#/$defs/cardDef"
    CardList:
      $ref: "./schemas/catalog.schema.json#/$defs/cardList"
    InvestigatorArtwork:
      $ref: "./schemas/catalog.schema.json#/$defs/investigatorArtwork"
    GameStep:
      $ref: "./schemas/game-step.schema.json"
    GameList:
      $ref: "./schemas/game-list.schema.json"
    GetGame:
      $ref: "./schemas/get-game.schema.json"
security:
  - TokenAuth: []
