asyncapi: 3.1.0
info:
  title: Arkham Horror WebSocket API
  version: 0.1.11
  description: |
    Envelope-level contract for participant, spectator, and Epic Multiplayer
    sockets. The server sends an RFC 6455 ping every 15 seconds and may negotiate
    permessage-deflate. When a game room is closed, the server sends a final
    RoomClosed message (reason such as "deleted", "abandoned" or "maintenance")
    before closing subscribers. Game rooms also broadcast GameWatcherCount when
    the number of watching sockets changes. Disconnected subscribers do not
    receive buffered updates, so a reconnect must refetch the authoritative REST
    snapshot.

    Game snapshots are per-view: a GameUpdate frame may be redacted for the
    receiving connection's seat(s). In a redacted frame, an investigator the
    connection does not control may have empty hidden zones and an optional
    handCount, and log entries addressed only to other seats may be omitted
    (see investigator.schema.json). handCount may be absent from any frame.
servers:
  production:
    host: arkhamhorror.app
    protocol: wss
    pathname: /api/v1
    description: |
      Send `Authorization: Token <token>` when the client can set upgrade
      headers. The `token` query parameter is a compatibility fallback used
      only when the Authorization header is absent.
    security:
      - $ref: "#/components/securitySchemes/tokenHeader"
      - $ref: "#/components/securitySchemes/tokenQuery"
    x-authentication-precedence:
      - tokenHeader
      - tokenQuery
    x-keepalive-ping-seconds: 15
    x-message-compression: permessage-deflate-optional
channels:
  game:
    address: /arkham/games/{gameId}
    description: |
      Bidirectional game stream. The server publishes full (non-delta) game
      snapshots and transient UI messages; the client sends answer payloads. Each
      GameUpdate snapshot may be redacted for the participant connection's
      seat(s), so participants holding different seats may receive different
      frames for the same game state.
    parameters:
      gameId:
        description: Arkham game UUID
    messages:
      serverMessage:
        $ref: "#/components/messages/ServerMessage"
      clientAnswer:
        $ref: "#/components/messages/ClientAnswer"
  spectator:
    address: /arkham/games/{gameId}/spectate
    description: |
      Unauthenticated, read-only game stream. The server publishes full
      (non-delta) snapshots and the same transient messages as the
      participant stream. Each GameUpdate snapshot may be redacted for a
      spectator, who controls no investigator. Inbound client frames are
      ignored without being decoded or applied.
    parameters:
      gameId:
        description: Arkham game UUID
    messages:
      serverMessage:
        $ref: "#/components/messages/ServerMessage"
  event:
    address: /arkham/events/{eventId}
    description: |
      Read-only Epic Multiplayer event stream. Inbound client frames are
      ignored. EventChanged requires a REST event-details refetch.
    parameters:
      eventId:
        description: Epic Multiplayer event UUID
    messages:
      serverMessage:
        $ref: "#/components/messages/ServerMessage"
operations:
  receiveGameMessages:
    action: receive
    description: |
      Receive authoritative snapshots, which may be redacted for this
      connection's seat(s), and transient game messages.
    channel:
      $ref: "#/channels/game"
    messages:
      - $ref: "#/channels/game/messages/serverMessage"
  sendGameAnswers:
    action: send
    description: |
      Send one answer to the authoritative game engine. If the engine rejects
      the answer as unhandled (for example an illegal amount/payment/exchange
      allocation, stale question version, wrong question type, or wrong choice
      id), the server sends one AnswerRejected with the rejection reason and the
      submitted questionVersion when available to the same participant connection
      only. It is not broadcast to other participants or spectators, and game
      state remains unchanged. The unchanged GameUpdate is still published to the
      room; clients must accept AnswerRejected before or after that GameUpdate.
      GameError is reserved for room-wide exceptions/errors and may contain
      internal diagnostic text.
    channel:
      $ref: "#/channels/game"
    messages:
      - $ref: "#/channels/game/messages/clientAnswer"
  receiveSpectatorMessages:
    action: receive
    description: |
      Receive game snapshots, which may be redacted for a spectator, and
      transient messages.
    security: []
    channel:
      $ref: "#/channels/spectator"
    messages:
      - $ref: "#/channels/spectator/messages/serverMessage"
  receiveEventMessages:
    action: receive
    description: Receive shared event state or an event-details change signal.
    channel:
      $ref: "#/channels/event"
    messages:
      - $ref: "#/channels/event/messages/serverMessage"
components:
  securitySchemes:
    tokenHeader:
      type: httpApiKey
      in: header
      name: Authorization
      description: Send the value as `Token <token>`.
    tokenQuery:
      type: httpApiKey
      in: query
      name: token
      description: Compatibility fallback when an Authorization header is absent.
  messages:
    ServerMessage:
      payload:
        $ref: "./schemas/server-message.schema.json"
    ClientAnswer:
      payload:
        $ref: "./schemas/client-answer.schema.json"
