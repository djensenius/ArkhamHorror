name:    arkham-api
version: "0.0.0"
language: GHC2021

extra-source-files:
- digital-ocean.crt

default-extensions:
- AllowAmbiguousTypes
- BlockArguments
- DataKinds
- DeriveAnyClass
- DerivingStrategies
- DerivingVia
- ExtendedDefaultRules
- FunctionalDependencies
- GADTs
- LambdaCase
- MultiWayIf
- NoImplicitPrelude
- NoMonomorphismRestriction
- OverloadedLabels
- OverloadedRecordDot
- OverloadedStrings
- PatternSynonyms
- RecordWildCards
- StrictData
- TypeFamilies
- TypeFamilyDependencies
- TypeOperators
- UndecidableInstances
- ViewPatterns

build-tools:
- cards-discover

dependencies:
  - base

library:
  source-dirs: library
  when:
    - condition: (flag(dev)) || (flag(library-only))
      then:
        ghc-options:
        - -Wall
        - -fwarn-tabs
        - -O0
        cpp-options: -DDEVELOPMENT
      else:
        ghc-options:
        - -Wall
        - -fwarn-tabs
        - -O2
        - +RTS -V0 -RTS
    - condition: flag(internal-test-hooks)
      cpp-options: -DINTERNAL_TEST_HOOKS
      dependencies:
        - hspec
  dependencies:
    - MonadRandom
    - aeson
    - aeson-casing
    - aeson-diff
    - amazonka
    - amazonka-core
    - amazonka-s3
    - amazonka-sso
    - amazonka-sts
    - annotated-exception
    - async
    - base16-bytestring
    - bugsnag
    - bugsnag-hs
    - bugsnag-yesod
    - bcrypt
    - bytestring
    - case-insensitive
    - classy-prelude
    - conduit
    - constraints-extras
    - containers
    - cryptohash-sha256
    - crypton-x509-store
    - data-default-class
    - dependent-map
    - dependent-sum
    - dependent-sum-template
    - devel-store-lock
    - directory
    - email-validate
    - errors
    - esqueleto
    - exceptions
    - extra
    - fast-logger
    - file-embed
    - foreign-store
    - hashable
    - hedis
    - http-api-data
    - http-client
    - http-client-tls
    - http-conduit
    - http-types
    - ini
    - jose
    - lens
    - lens-aeson
    - mailtrap
    - monad-logger
    - monad-time
    - monoidal-containers
    - mtl >= 2.3.1
    - parsec
    - path-pieces
    - persistent
    - persistent-postgresql
    - pretty-simple
    - process
    - random-shuffle
    - regex-posix
    - relude
    - resource-pool
    - safe
    - semialign
    - some
    - stm
    - string-conversions
    - template-haskell
    - text
    - these
    - these-lens
    - time
    - tls
    - transformers
    - unliftio
    - unordered-containers
    - uri-bytestring
    - uuid
    - vector
    - wai
    - wai-extra
    - wai-logger
    - warp
    - websockets
    - yaml
    - yesod-core
    - yesod-persistent
    - zlib
    - yesod-test
    - yesod-websockets

executables:
  arkham-api:
    main: main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - foreign-store
      - warp
      - arkham-api
    when:
      - condition: flag(library-only)
        buildable: false

  arkham-capabilities-probe:
    main: Main.hs
    source-dirs: app-capabilities-probe
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - aeson
      - arkham-api
      - bytestring
      - relude
      - yaml
    when:
      - condition: flag(library-only)
        buildable: false

  arkham-replay:
    main: Main.hs
    source-dirs: app-replay
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - aeson
      - arkham-api
      - bytestring
      - MonadRandom
      - text
    when:
      - condition: flag(library-only)
        buildable: false

flags:
  library-only:
    description: Build for use with "yesod devel"
    manual: false
    default: false
  dev:
    description: Turn on development settings, like auto-reload templates.
    manual: false
    default: false
  internal-test-hooks:
    description: >
      Include this library's internal white-box regression Spec (e.g.
      Api.Arkham.AwsEnvSupervisor's awsEnvSupervisorInternalSpec, which
      exercises credential-acquisition primitives this module
      deliberately never exports otherwise) and its Test.Hspec
      dependency in the library component itself. Defaults on so an
      ordinary `stack build`/`stack test` (as used by this repository's
      own CI and local development) needs no extra flag to build and
      run the test suite. A genuine production/deployment build (see
      Dockerfile) explicitly disables this flag so the shipped library
      never depends on hspec.
    manual: true
    default: true

tests:
  spec:
    main: Spec.hs
    source-dirs: tests
    ghc-options: -threaded -rtsopts -O0 "-with-rtsopts=-N"
    dependencies:
      - MonadRandom
      - arkham-api
      - aeson
      - aeson-diff
      - amazonka
      - amazonka-core
      - bytestring
      - containers
      - devel-store-lock
      - directory
      - exceptions
      - foreign-store
      - hspec
      - hspec-expectations-lifted
      - http-client
      - http-types
      - jose
      - lens
      - monad-time
      - uuid
      - mtl
      - persistent
      - random
      - base16-bytestring
      - cryptohash-sha256
      - relude
      - text
      - time
      - unordered-containers
      - yaml
