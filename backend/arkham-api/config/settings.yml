host: "_env:HOST:*4"
port: "_env:PORT:3002"
ip-from-header: "_env:IP_FROM_HEADER:false"
jwt-secret: "_env:JWT_SECRET:arkhamhorrorlcgarkhamhorrorlcgarkhamhorrorlcg"
database-url: "_env:DATABASE_URL:postgres://localhost:5432/arkham-horror-backend"
database-pool-size: "_env:DB_POOL:10"
detailed-logging: false
should-log-all: false
redis-conn: "_env:REDIS_CONN:"
mailtrap-api-token: "_env:MAILTRAP_API_TOKEN:empty"
bugsnag-api-token: "_env:BUGSNAG_API_TOKEN:empty"
asset-host: "_env:ASSET_HOST:"
# permessage-deflate on the game/event websockets. Kill switch, so a suspected
# compression regression can be bisected in production with a restart.
websocket-compression: "_env:ARKHAM_WS_COMPRESSION:true"

# Optional locale-catalog pointer advertised through GET /api/v1/capabilities
# (capability "i18n.locale-catalog.v1"). The backend never serves catalog
# content; these settings only describe where the deployment publishes it.
#
# Leave every one of them blank to disable the pointer: the capabilities
# response then keeps its exact legacy shape. Supplying some but not all of
# them is a startup error by design, so a half-removed pointer can never be
# silently dropped, and an invalid value fails startup instead of advertising
# a broken catalog. Prefer the same-origin relative path; an absolute URL must
# be https. See docs/locale-catalog.md.
locale-catalog-manifest-url: "_env:ARKHAM_LOCALE_CATALOG_MANIFEST_URL:"
locale-catalog-revision: "_env:ARKHAM_LOCALE_CATALOG_REVISION:"
locale-catalog-schema-version: "_env:ARKHAM_LOCALE_CATALOG_SCHEMA_VERSION:"
locale-catalog-default-locale: "_env:ARKHAM_LOCALE_CATALOG_DEFAULT_LOCALE:"
locale-catalog-locales: "_env:ARKHAM_LOCALE_CATALOG_LOCALES:"
locale-catalog-manifest-sha256: "_env:ARKHAM_LOCALE_CATALOG_MANIFEST_SHA256:"
