name: Contract CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA to diff governed contract artifacts against (required; this workflow never infers one)."
        required: true
        type: string

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: /usr/bin/env -i HOME=/home/runner LOCALE_CATALOG_MISE_ROOT=/home/runner/.local/share/mise PATH=/home/runner/.local/share/mise/bin:/usr/bin:/bin /bin/bash --noprofile --norc -eo pipefail {0}

jobs:
  fixtures:
    name: Golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      # `mise` itself is resolved through PATH by the action that just
      # installed it, and a restored cache can put executables on that PATH.
      # Assert the exact pinned version and a plausible install location before
      # any governed command runs. What *is* pinned after this point: mise
      # resolves Python 3.14.7, Node 26.7.0 and uv 0.12.6 from mise.toml, and
      # every governed command then uses their absolute paths, verified against
      # the digests in scripts/locale_catalog_python_runtime.json. What is not
      # pinned: this `mise` binary itself, and the runner image's own /usr/bin.
      - name: Assert the pinned mise version before governed commands
        run: |
          set -eu
          resolved="$(command -v mise)"
          printf 'mise resolved to %s\n' "$resolved"
          case "$resolved" in
            "$HOME"/.local/*|/opt/hostedtoolcache/*|"${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/*) ;;
            *) printf 'refusing an unexpected mise location: %s\n' "$resolved" >&2; exit 1 ;;
          esac
          mise --version | head -1 | grep -Eq '^2026\.8\.14( |$)'
      - run: mise run contracts:catalog-fixture
      - run: mise run locale-catalog:python-boundary-test
      - run: mise run contracts:fixtures
      - name: Enforce revision drift against the event's explicit base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.event.inputs.base_sha }}
        shell: /bin/sh -e {0}
        run: |
          /usr/bin/env -i \
            HOME=/home/runner \
            LOCALE_CATALOG_MISE_ROOT=/home/runner/.local/share/mise \
            PATH=/home/runner/.local/share/mise/bin:/usr/bin:/bin \
            /bin/bash --noprofile --norc -eo pipefail -c \
              'mise run contracts:revision-drift -- "$1"' -- "$BASE_SHA"

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      # `mise` itself is resolved through PATH by the action that just
      # installed it, and a restored cache can put executables on that PATH.
      # Assert the exact pinned version and a plausible install location before
      # any governed command runs. What *is* pinned after this point: mise
      # resolves Python 3.14.7, Node 26.7.0 and uv 0.12.6 from mise.toml, and
      # every governed command then uses their absolute paths, verified against
      # the digests in scripts/locale_catalog_python_runtime.json. What is not
      # pinned: this `mise` binary itself, and the runner image's own /usr/bin.
      - name: Assert the pinned mise version before governed commands
        run: |
          set -eu
          resolved="$(command -v mise)"
          printf 'mise resolved to %s\n' "$resolved"
          case "$resolved" in
            "$HOME"/.local/*|/opt/hostedtoolcache/*|"${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/*) ;;
            *) printf 'refusing an unexpected mise location: %s\n' "$resolved" >&2; exit 1 ;;
          esac
          mise --version | head -1 | grep -Eq '^2026\.8\.14( |$)'
      - run: mise run contracts:openapi

  asyncapi:
    name: AsyncAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      # `mise` itself is resolved through PATH by the action that just
      # installed it, and a restored cache can put executables on that PATH.
      # Assert the exact pinned version and a plausible install location before
      # any governed command runs. What *is* pinned after this point: mise
      # resolves Python 3.14.7, Node 26.7.0 and uv 0.12.6 from mise.toml, and
      # every governed command then uses their absolute paths, verified against
      # the digests in scripts/locale_catalog_python_runtime.json. What is not
      # pinned: this `mise` binary itself, and the runner image's own /usr/bin.
      - name: Assert the pinned mise version before governed commands
        run: |
          set -eu
          resolved="$(command -v mise)"
          printf 'mise resolved to %s\n' "$resolved"
          case "$resolved" in
            "$HOME"/.local/*|/opt/hostedtoolcache/*|"${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/*) ;;
            *) printf 'refusing an unexpected mise location: %s\n' "$resolved" >&2; exit 1 ;;
          esac
          mise --version | head -1 | grep -Eq '^2026\.8\.14( |$)'
      - run: mise run contracts:asyncapi

  routes:
    name: Route inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      # `mise` itself is resolved through PATH by the action that just
      # installed it, and a restored cache can put executables on that PATH.
      # Assert the exact pinned version and a plausible install location before
      # any governed command runs. What *is* pinned after this point: mise
      # resolves Python 3.14.7, Node 26.7.0 and uv 0.12.6 from mise.toml, and
      # every governed command then uses their absolute paths, verified against
      # the digests in scripts/locale_catalog_python_runtime.json. What is not
      # pinned: this `mise` binary itself, and the runner image's own /usr/bin.
      - name: Assert the pinned mise version before governed commands
        run: |
          set -eu
          resolved="$(command -v mise)"
          printf 'mise resolved to %s\n' "$resolved"
          case "$resolved" in
            "$HOME"/.local/*|/opt/hostedtoolcache/*|"${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"/*) ;;
            *) printf 'refusing an unexpected mise location: %s\n' "$resolved" >&2; exit 1 ;;
          esac
