name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./backend

jobs:
  build:
    name: stack / ghc ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ["3.7.1"]
        ghc: ["9.14.1"]

    steps:
    - uses: actions/checkout@v3
    - uses: haskell-actions/setup@v2
      name: Setup Haskell Stack
      with:
        ghc-version: ${{ matrix.ghc }}
        stack-version: ${{ matrix.stack }}

    - name: Cache
      uses: actions/cache@v3
      env:
        cache-name: cache-stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.stack-work') }}-${{ hashFiles('**/stack.yaml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install pcre
      run: |
        sudo apt-get install -y libpcre3 libpcre3-dev
    - name: Install dependencies
      run: |
        stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks --only-dependencies
    - name: Build
      run: stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks cards-discover && stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks
    - name: Run tests
      run: stack test --system-ghc

    # The deployment seam: generate a *real* catalog and drive the production
    # settings parser, capabilities handler and toEncoding over it, rather than
    # modelling any of that in Python. Runs here because this is the job that
    # already has the backend built.
    - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: 2026.8.14
        cache: true
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ${{ github.workspace }}/frontend
    - name: Generate the public locale catalog
      run: mise run locale-catalog:generate
      working-directory: ${{ github.workspace }}
    - name: Verify the generated catalog configures the real capabilities handler
      run: mise run locale-catalog:capability-probe
      working-directory: ${{ github.workspace }}
