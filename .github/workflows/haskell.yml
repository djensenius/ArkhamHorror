name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./backend

jobs:
  build:
    name: stack / ghc ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ["3.7.1"]
        ghc: ["9.14.1"]

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      name: Setup Haskell Stack
      with:
        ghc-version: ${{ matrix.ghc }}
        stack-version: ${{ matrix.stack }}

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.stack-work') }}-${{ hashFiles('**/stack.yaml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install pcre
      run: |
        sudo apt-get install -y libpcre3 libpcre3-dev
    - name: Install dependencies
      run: |
        stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks --only-dependencies
    - name: Build
      run: stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks cards-discover && stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks
    - name: Run tests
      run: stack test --system-ghc

    # The deployment seam: generate a *real* catalog and drive the production
    # settings parser, capabilities handler and toEncoding over it, rather than
    # modelling any of that in Python. Runs here because this is the job that
    # already has the backend built.
    - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: 2026.8.14
        cache: true
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ${{ github.workspace }}/frontend
    - name: Bind the Stack probe authority
      id: stack-probe
      run: |
        stack_path="$(command -v stack)"
        test -n "${stack_path}"
        case "${stack_path}" in
          /*) ;;
          *) echo "stack setup did not provide an absolute executable path" >&2; exit 1 ;;
        esac
        printf 'path=%s\n' "${stack_path}" >> "${GITHUB_OUTPUT}"
    # Both of these are governed locale-catalog routes, so they run in the
    # same sealed shell the contract and locale-catalog workflows use: this
    # job's default `bash` inherits the runner environment, and the
    # authoritative launcher requires the toolchain root to be named
    # explicitly rather than inferred from it.
    - name: Generate the public locale catalog
      run: mise run locale-catalog:generate
      shell: /usr/bin/env -i HOME=/home/runner LOCALE_CATALOG_MISE_ROOT=/home/runner/.local/share/mise PATH=/home/runner/.local/share/mise/bin:/usr/bin:/bin /bin/bash --noprofile --norc -eo pipefail {0}
      working-directory: ${{ github.workspace }}
    - name: Verify the generated catalog configures the real capabilities handler
      run: |
        /usr/bin/env -i \
          HOME=/home/runner \
          LOCALE_CATALOG_MISE_ROOT=/home/runner/.local/share/mise \
          LOCALE_CATALOG_STACK="${LOCALE_CATALOG_STACK:?missing Stack probe authority}" \
          PATH=/home/runner/.local/share/mise/bin:/usr/bin:/bin \
          /bin/bash --noprofile --norc -eo pipefail -c 'mise run locale-catalog:capability-probe'
      shell: /bin/sh -e {0}
      env:
        LOCALE_CATALOG_STACK: ${{ steps.stack-probe.outputs.path }}
      working-directory: ${{ github.workspace }}
