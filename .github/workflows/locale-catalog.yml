name: Locale catalog

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: locale-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Generation, schema, and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - run: mise run locale-catalog:backend-keys-test
      - run: mise run locale-catalog:backend-keys-check
      - run: mise run locale-catalog:validate

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - run: mise run locale-catalog:test
      # The catalog is deployment-owned output: it must fall out of the real
      # production build (npm prebuild) and land in the static root nginx
      # serves, not just out of the generator invoked directly.
      - name: Build the frontend
        run: npm run build
        working-directory: frontend
      - name: Verify the catalog ships in the build output
        run: node scripts/locale-catalog/verify-dist.mjs
        working-directory: frontend
      # The offline cache restores a build output without `frontend/public`.
      - run: mise run locale-catalog:offline-cache-hit-test
      # The offline packager builds into its own output directory; a second,
      # incremental build there must precompress that directory rather than the
      # default one.
      - name: Build and verify a custom output directory, twice
        run: |
          set -euo pipefail
          for attempt in first second; do
            PRECOMPRESS_DIST=dist-custom npm run build -- --outDir dist-custom --emptyOutDir
            node scripts/locale-catalog/verify-dist.mjs --dist dist-custom
            test -f dist-custom/locale-catalog/manifest.json.br
          done
        working-directory: frontend

  serving:
    name: Serving and rollout behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.8.14
          cache: true
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      # Boots real nginx over prod.nginxconf and over the config the offline
      # packager generates: status/cache/MIME matrix plus a rolling deploy in
      # both directions.
      - run: mise run locale-catalog:offline-cache-test
      - run: mise run locale-catalog:serving
