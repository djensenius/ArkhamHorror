name: Publish container images

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - ".github/actions/publish-image-build-smoke/**"
      - ".dockerignore"
      - "Dockerfile"
      - "backend/arkham-api/config/**"
      - "infra/**"
      - "migrate.sh"
      - "web-entrypoint.sh"
      - "start.sh"
      - "prod.nginxconf"
      - "setup.sql"
      - "migrations/**"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, tag, or SHA to publish instead of the workflow commit"
        required: false
        type: string

concurrency:
  # PR smoke runs are isolated per PR and cancel superseded commits. Pushes to
  # main serialize in publish-image-main with cancel-in-progress disabled.
  # Manual dispatches use a separate group per requested ref, so an old-ref
  # dispatch can never displace a pending main publish. GitHub Actions does not
  # support a concurrency queue: key; only group and cancel-in-progress are
  # available. The publish step still re-checks that the SHA is main's current
  # head before moving :main tags, which protects tag order across groups.
  group: ${{ github.event_name == 'pull_request' && format('publish-image-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('publish-image-dispatch-{0}', github.event.inputs.ref || github.ref) || 'publish-image-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

env:
  WEB_IMAGE: ghcr.io/djensenius/arkham-horror
  MIGRATE_IMAGE: ghcr.io/djensenius/arkham-horror-migrate
  POSTGRES_IMAGE: postgres:14.6-alpine@sha256:a0f7890719c3c42b9f78f1ad98b2cd45aa2ee3472da12f9d2d3bfbc07f421146

jobs:
  smoke:
    name: Build and smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and smoke test images
        uses: ./.github/actions/publish-image-build-smoke
        with:
          checkout-ref: ${{ github.event.inputs.ref || github.sha }}
          github-token: ${{ github.token }}
          requested-ref: ${{ github.event.inputs.ref || '' }}

  publish:
    name: Build, smoke test, and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and smoke test images
        id: build-smoke
        uses: ./.github/actions/publish-image-build-smoke
        with:
          checkout-ref: ${{ github.event.inputs.ref || github.sha }}
          github-token: ${{ github.token }}
          requested-ref: ${{ github.event.inputs.ref || '' }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ steps.build-smoke.outputs.git-sha }}
          WEB_SHA: ${{ steps.build-smoke.outputs.web-sha }}
          WEB_MAIN: ${{ steps.build-smoke.outputs.web-main }}
          MIGRATE_SHA: ${{ steps.build-smoke.outputs.migrate-sha }}
          MIGRATE_MAIN: ${{ steps.build-smoke.outputs.migrate-main }}
          PUBLISH_MAIN: ${{ steps.build-smoke.outputs.publish-main }}
        run: |
          set -euo pipefail
          docker push "${WEB_SHA}"
          docker push "${MIGRATE_SHA}"
          if [[ "${PUBLISH_MAIN}" == "true" ]]; then
            current_main="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("sha", ""))')"
            if [[ ! "${current_main}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
              echo "GitHub API returned invalid main SHA: ${current_main}" >&2
              exit 1
            fi
            if [[ "${GIT_SHA}" != "${current_main}" ]]; then
              echo "Skipping moving :main tags because ${GIT_SHA} is no longer main (${current_main})."
              exit 0
            fi
            docker push "${WEB_MAIN}"
            docker push "${MIGRATE_MAIN}"
          else
            echo "Skipping moving :main tags for non-main ref dispatch."
          fi
