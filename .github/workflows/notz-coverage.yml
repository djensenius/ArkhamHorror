name: Night of the Zealot coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./backend

jobs:
  generate:
    name: Generate deterministic prompt coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@bda9c527d4136f7759733016190c34a24c84f4f4
        name: Setup Haskell Stack
        with:
          ghc-version: "9.14.1"
          stack-version: "3.7.1"
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        env:
          cache-name: cache-stack
        with:
          path: ~/.stack
          key: ${{ runner.os }}-notz-coverage-${{ env.cache-name }}-${{ hashFiles('**/stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-notz-coverage-${{ env.cache-name }}-
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
      - name: Install pcre
        run: sudo apt-get install -y libpcre3 libpcre3-dev
      - name: Generate recordings
        env:
          ARKHAM_NOTZ_COVERAGE_DIR: ${{ github.workspace }}/contracts/coverage/night-of-the-zealot/generated
        run: |
          stack test arkham-api:spec --system-ghc --test-arguments '--match "Night of the Zealot coverage generator"'
      - name: Upload coverage recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: night-of-the-zealot-coverage
          path: contracts/coverage/night-of-the-zealot/generated
          if-no-files-found: error
