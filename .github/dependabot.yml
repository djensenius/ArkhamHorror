version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - /tools/contract-validators/openapi
      - /tools/contract-validators/asyncapi
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
